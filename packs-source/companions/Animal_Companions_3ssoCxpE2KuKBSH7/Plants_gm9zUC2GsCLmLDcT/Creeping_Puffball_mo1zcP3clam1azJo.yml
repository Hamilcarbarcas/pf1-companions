  description:
    value: <p>This surprisingly mobile, multicolored ball of fungus crawls around on a nest of dozens of little filament-like “legs.” Its poisonous spores cause those affected to endure bright, dazzling spots of color.</p><p><strong>Natural Attacks:</strong> slam (1d4 plus poison)</p><p><strong>Special Qualities:</strong> Defensive Puff, Cannot be Tripped</p><p><strong>Special Attacks:</strong> Poison</p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, -2 Dex, +2 Con.</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, moderate Wisdom, Dazzled 1 round on each failed save, 1 save to cure.</p><p>Defensive Puff (Ex):</p><p>Once per minute as an Immediate Action when hit, the fungus can expose one adjacent creature to its poison.</p>
