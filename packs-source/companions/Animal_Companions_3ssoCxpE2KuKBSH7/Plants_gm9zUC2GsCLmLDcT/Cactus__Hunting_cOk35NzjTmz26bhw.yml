  description:
    value: <p>Able to crawl swiftly on five rootlike legs, the hunting cactus has long arms it can slam foes with—arms covered with hundreds of thin, sharp needles.</p><p><strong>Natural Attacks:</strong> 2 slams (1d6)</p><p><strong>Special Qualities:</strong> Needles, CMD +6 vs. Trip</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +2 Con; Low-Light Vision.</p><p>Needles (Ex):</p><p>A creature grappling a hunting cactus or attacking it with a Natural Attack or Unarmed Attack takes 1d4 points of piercing damage.</p>
