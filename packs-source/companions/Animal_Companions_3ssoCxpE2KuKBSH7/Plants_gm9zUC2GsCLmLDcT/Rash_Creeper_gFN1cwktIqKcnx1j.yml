    value: <p>This mass of creeping vines and leaves slithers almost like a snake. Contact with this predatory plant causes a sickening and sometimes debilitating rash.</p><p><strong>Natural Attacks:</strong> slam (1d4 plus poison)</p><p><strong>Special Qualities:</strong> Cannot be Tripped</p><p><strong>Special Attacks:</strong> Poison</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, -2 Dex, +2 Con; Poison (upgraded).</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, mild Dexterity, Sickened 1 round on each failed save, 1 save to cure. At 4th level, the poison follows the moderate Dexterity track, and requires 2 saves to cure</p>
