  description:
    value: <p><strong>Natural Attacks:</strong> 3 slams (1d3 plus bleed)</p><p><strong>Special Qualities:</strong> Tremorsense 60 ft. Change Foliage, Root Deep</p><p><strong>Special Attacks:</strong> Bleed (1d3)</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 Str, -2 Dex, +2 Con; Blinding Bloom, Bleed (1d6).</p><p>Change Foliage (Su):</p><p>Three times per day as an Immediate Action that does not provoke attacks of opportunity, a blood maize plant can make itself appear as a different type of plant. This new appearance mimics that of any plant up to two size categories smaller than the blood maize and need not resemble the blood maize’s true form. For example, the blood maize can take on the semblance of a pumpkin vine, strawberry plant, or sunflower. A blood maize plant’s statistics remain the same, even if it is masquerading as a plant of a smaller size category. It can’t assume the form of another plant creature and can imitate only the appearance of Plants that are normally considered part of the surrounding terrain. This effect is a visual illusion only and does not alter the perceived Scent or tactile properties of the blood maize. While using this ability, the blood maize gains a +10 Racial bonus on Stealth checks.</p><p>A successful DC 20 Knowledge (nature) or Survival check is required to identify the plant’s true nature. A creature that interacts with a blood maize plant while it is using this ability can disbelieve the illusion with a successful Will Save (DC = 10 + 1/2 HD + Charisma modifier). Changing back into its true form requires an Immediate Action. This is an Illusion (Glamer) effect.</p><p>Root Deep (Ex):</p><p>As a Free Action that doesn’t provoke attacks of opportunity, a blood maize plant can use its long hooklike appendage to root itself deep into dirt or soil, but not into rock or other harder materials. This grants the blood maize a +4 Racial bonus against Bull Rush or Trip attempts.</p><p>Blinding Bloom (Ex):</p><p>Once per day as a Standard Action that doesn’t provoke attacks of opportunity, a blood maize plant can release a stationary, 20-foot-high cloud of fine pollen in a 20-foot radius centered on its square. The cloud acts as an Obscuring Mist spell, but it lasts for 1 round, after which it dissipates. A creature in the cloud when the pollen is released or that moves into the cloud before it dissipates must succeed at a Fortitude Save (DC = 10 + 1/2 HD + Charisma modifier) or be Blinded for 1 round.</p>
