  description:
    value: <p><strong>Natural Attacks:</strong> bite (1d4), slam (1d3 plus strangling ensnare)</p><p><strong>Special Qualities:</strong> Pumpkin Form</p><p><strong>Special Attacks:</strong> Strangling Ensnare, Explode</p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +2 Str, -2 Dex, +2 Con; Fear Aura, Breath Weapon.</p><p>Strangling Ensnare (Ex):</p><p>A jack-o’-lantern’s slam attack entangles the target in its vines for 2d4 rounds unless the target succeeds at a DC 14 Reflex Save. The target can attempt to burst these entangling vines before the duration expires with a successful DC 12 Strength check as a Full-Round Action. While the target is Entangled, its vines also grasp at the target’s mouth. The target cannot speak or cast spells with verbal components while it is Entangled by the jack-o’-lantern. When a creature is Entangled by this ability, the jack-o’-lantern loses its slam attack, but it can end this ability as a Free Action. The save and the burst DCs are Constitution-based.</p><p>Explode (Ex):</p><p>One round after a jack-o’-lantern is reduced to 0 or fewer hit points, it explodes in a burst of flaming spores. Creatures within 10 feet of an exploding jack-o’-lantern must succeed at a Reflex Save (DC = 10 + 1/2 HD + Constitution modifier) or take 2d6 points of fire damage and be Stunned for 1 round. A successful save halves the damage and negates the stun.</p><p>Pumpkin Form (Su):</p><p>A jack-o’-lantern can shrink in size and douse its sinister fiery radiance, allowing it to blend in almost perfectly with normal pumpkins and take 20 on its Stealth checks to hide in plain sight as a normal pumpkin. While using this ability, a jack-o’-lantern loses its Fear aura. A jack-o’-lantern can use this ability as a Full-Round Action and end it as a Free Action.</p><p>Fear Aura (Su):</p><p>Any creature within 30 feet of a jack-o’-lantern must succeed at a Will Save (DC = 10 + 1/2 HD + Charisma modifier + 4 Racial bonus) or be Shaken for 2d6 minutes. If the Will Save is successful, the creature is immune to that jack-o’-lantern’s Fear aura for 24 hours. This is a vision-based mind-affecting Fear effect.</p><p>Breath Weapon (Su):</p><p>This Breath Weapon can be used once every 1d4 rounds, and deals 1d10 fire damage in a 20 ft. cone on a failed Reflex Save (DC 10 + 1/2 HD + Constitution modifier for half).</p>
