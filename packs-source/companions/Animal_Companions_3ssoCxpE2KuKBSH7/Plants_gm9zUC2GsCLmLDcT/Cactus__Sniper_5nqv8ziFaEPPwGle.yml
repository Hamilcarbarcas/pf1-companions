  description:
    value: <p>This single-stalked cactus sports dozens of long, thin needles. Capable of crawling on three stalklike roots, the sniper cactus can fire its thorns with deadly accuracy.</p><p><strong>Natural Attacks:</strong> gore (1d4)</p><p><strong>Special Qualities:</strong> CMD +2 vs. Trip</p><p><strong>Special Attacks:</strong> Thorns</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +2 Dex, +2 Con; Thorns (upgraded).</p><p>Thorns (Ex):</p><p>This Ranged Attack has a 60 foot range, deals 1d8 damage, and gains no bonus to damage from high Strength scores. At 4th level, the damage increases to 2d6 piercing damage, and the sniper cactus can fire two per round when making a full-attack action.</p>
