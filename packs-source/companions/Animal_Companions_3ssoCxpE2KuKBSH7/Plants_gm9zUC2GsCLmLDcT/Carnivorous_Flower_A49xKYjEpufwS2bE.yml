  description:
    value: <p><strong>Natural Attacks:</strong> bite (1d8)</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con; Rage.</p><p>Rage (Ex):</p><p>As a Free Action a carnivorous flower can enter a rage, gaining a +2 bonus on Melee Attack rolls, melee damage rolls, thrown weapon damage rolls, and Will Saving Throws . In addition, it takes a -2 penalty to Armor Class . It also gain 2 temporary hit points per Hit Die. A carnivorous flower can rage for up to 6 rounds per day. When its rage ends, it is Fatigued for 1 minute.</p>
