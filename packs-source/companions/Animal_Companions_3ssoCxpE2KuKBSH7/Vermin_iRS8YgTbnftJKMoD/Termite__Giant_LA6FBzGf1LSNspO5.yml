  description:
    value: '<p>The giant termite has a set of large powerful mandibles, and it is particularly effective when fighting alongside other termite companions.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>Special Qualities:</strong> CMD +8 vs. Trip</p><p><strong>Special Attacks:</strong> Swarming</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>4th-Level Advancement:</strong> size Medium; +3 natural armor; +4 Str, -2 Dex, +2 Con; Gnaw.</p><p>Swarming (Ex):</p><p>Two giant termites can share the same space, and if they both attack the same target, they are considered to be Flanking that foe.</p><p>Gnaw (Ex):</p><p>A giant termite''s bite attack ignores Hardness of 5 or less.</p>'
