  description:
    value: '<p>This towering insect walks on its back four legs. Its head is triangular and its front legs sport razor-sharp edges and claws.</p><p><strong>Natural Attacks:</strong> 2 claws (1d4 plus grab)</p><p><strong>Special Attacks:</strong> Grab, Lunge</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Mandibles, Sudden Strike.</p><p>Lunge (Ex):</p><p>A giant mantis’s limbs are capable of reaching much farther than normal for a creature of its size. As a full-attack action, it can make a single attack with its claws at double its normal reach. When a giant mantis attacks with a claw in this manner, it gains a +4 bonus on its attack roll. A giant mantis cannot make attacks of opportunity with its lunge.</p><p>Mandibles (Ex):</p><p>A giant mantis gains a secondary attack against a grabbed target, dealing 1d6 damage.</p><p>Sudden Strike (Ex):</p><p>A giant mantis may take a Full Attack action in the surprise round.</p>'
