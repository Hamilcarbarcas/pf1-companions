  description:
    value: '<p>This many-legged wormlike creature is a larval form of a moth or butterfly, but as long as it remains a vermin companion, it will not go through this metamorphosis.</p><p><strong>Natural Attacks:</strong> bite (1d6), bristle (1d4 plus poison)</p><p><strong>Special Qualities:</strong> Compression, Cannot be Tripped</p><p><strong>Special Attacks:</strong> Bristles, Poison</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, -2 Dex, +2 Con.</p><p>Bristles (Ex):</p><p>A creature attacking the giant caterpillar with a natural attack or non-reach melee weapon must succeed at a Reflex Save (DC = 10 + 1/2 HD + Dexterity modifier + 2 Racial bonus) or take damage as if the caterpillar had struck the creature with its bristles attack.</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, moderate Strength, 1 save to cure.</p><p>*This is a secondary natural attack that deals piercing damage, and takes a -5 penalty to hit, see Natural Weapon for more information on how secondary attacks work.</p>'
