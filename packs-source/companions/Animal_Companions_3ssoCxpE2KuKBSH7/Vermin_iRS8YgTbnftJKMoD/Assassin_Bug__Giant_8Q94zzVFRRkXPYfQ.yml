  description:
    value: '<p>This long-legged, beetle-like insect can spew a stream of poison at its foes from a distance.</p><p><strong>Natural Attacks:</strong> bite (1d4 plus poison), 2 claws (1d3)</p><p><strong>Special Qualities:</strong> CMD +8 vs. Trip</p><p><strong>Special Attacks:</strong> Poison, Poison Stream</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, -2 Dex, +2 Con; Poison (upgraded).</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, moderate Dexterity, 1 save to cure. At 4th level, the poison requires 2 saves to cure.</p><p>Poison Stream (Ex):</p><p>The assassin bug releases a stream of its poison in a 15 ft. line, exposing all creatures targeted to its poison unless the succeed on a Reflex Save (DC = 10 + 1/2 HD + Dexterity modifier). This ability is usable every 1d4 rounds as a Standard Action.</p>'
