  description:
    value: '<p>The giant locust has long limber legs and the ability to spit a caustic glob of noxious goo.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>Special Qualities:</strong> +18 Acrobatics When Jumping, Leap, CMD +8 vs. Trip</p><p><strong>Special Attacks:</strong> Spit Goo</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, -2 Dex, +2 Con; Voracious.</p><p>Spit Goo (Ex):</p><p>A giant locust can spit at a target within 30 ft. as a ranged Touch Attack, causing them to become Sickened for 1 round on a hit.</p><p>Leap (Ex):</p><p>A giant locust can take 10 on Acrobatics checks to jump, even when distracted or threatened.</p><p>Voracious (Ex):</p><p>A giant locust''s bite attack deals double damage to creatures with the plant subtype and to objects made of paper, wood, or other plant materials.</p>'
