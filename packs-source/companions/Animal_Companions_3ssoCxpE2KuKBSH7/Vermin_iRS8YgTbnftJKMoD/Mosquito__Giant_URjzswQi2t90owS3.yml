  description:
    value: '<p>Between its bloodthirsty nature and the annoying drone of its wings, the giant mosquito is a much-loathed creature. Unlike its smaller cousins, a giant mosquito can easily kill larger creatures by draining them of their blood.</p><p><strong>Natural Attacks:</strong> bite (1d6 plus bleed and grab)</p><p><strong>Special Qualities:</strong> CMD +8 vs. Trip</p><p><strong>Special Attacks:</strong> Bleed (1d4), Grab</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>7th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, -2 Dex, +2 Con; Bleed (2d4), Blood Drain (1d2 Constitution).</p>'
