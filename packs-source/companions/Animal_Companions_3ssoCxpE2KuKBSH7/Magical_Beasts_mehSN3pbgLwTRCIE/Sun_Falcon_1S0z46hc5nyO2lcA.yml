  description:
    value: <p><strong>Natural Attacks:</strong> talon (1d4 plus burn)</p><p><strong>Special Attacks:</strong> Breath Weapon, Burn (1d4)</p><p><strong>9th-Level Advancement:</strong> size Small; +4 natural armor; +2 Str, +4 Con; Breath Weapon (upgraded), Burn (1d6).</p><p>Breath Weapon (Su):</p><p>This breath attack can be used once per day, and deals 3d6 fire damage in a 30 ft. line on a failed Reflex Save (DC 10 + 1/2 HD + Constitution modifier for half). If the companion's owner possesses the Beast Speaker Mastery feat, this ability can be used three times per day.</p><p>Blinding Flash (Su):</p><p>Three times per day, the sun falcon can blast an intense wave of heat and light in a 20-foot cone as a Standard Action. Creatures within this area must succeed at a Reflex Save (DC = 10 + 1/2 HD + Charisma modifier) or take 1d6 points of fire damage and be Blinded for 1d4+1 rounds. Creatures that succeed at this save take no fire damage and are instead Dazzled for 1 round.</p>
