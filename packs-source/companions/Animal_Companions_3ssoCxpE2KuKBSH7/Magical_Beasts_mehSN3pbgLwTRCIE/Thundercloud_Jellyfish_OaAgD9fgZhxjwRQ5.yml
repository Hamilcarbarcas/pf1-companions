  description:
    value: '<p><strong>Natural Attacks:</strong> shocking tentacle (1d6 plus paralysis)</p><p><strong>Special Qualities:</strong> Blind, Amorphous, Damage Reduction 10/Slashing or Piercing, Cannot be Tripped</p><p><strong>Special Attacks:</strong> Shocking Tentacles, Paralysis</p><p><em>Mindless: no Intelligence score (set Intelligence to blank on the actor).</em></p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con.</p><p>Shocking Tentacles (Ex):</p><p>A thundercloud jellyfish’s arms deliver electricity damage and a Paralysis effect with a melee Touch Attack. The creature’s Strength modifier is used for the attack roll but is not added to damage. Additionally, when large size, the arms have a 10-foot reach. The arms are unable to Grapple unless the target creature is 3 size categories smaller than the thundercloud Jellyfish. The arms are predominantly for bringing plant material to the mouth within the bell, not for picking up or wrapping around larger foes.</p>'
