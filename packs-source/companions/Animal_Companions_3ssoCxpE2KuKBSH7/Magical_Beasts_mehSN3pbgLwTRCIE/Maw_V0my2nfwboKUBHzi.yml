  description:
    value: <p>Maws are an odd creature that consists of a reptilian, tailless body on two strong legs. The head comprises most of the torso and is largely the gaping mouth. They are omnivorous and will eat nearly anything they come across. Their voracious appetites and aggressiveness make them a general nuisance to nearby societies.</p><p><strong>Natural Attacks:</strong> bite (1d8), claw (1d3)</p><p><strong>Special Qualities:</strong> +4 to Saves vs. Disease and Poison</p><p><strong>7th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, -2 Dex, +2 Con; Disease.</p><p>Disease (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, causes red ache.</p>
