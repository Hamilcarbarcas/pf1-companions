  description:
    value: <p><strong>Natural Attacks:</strong> bite (1d4)</p><p><strong>Special Qualities:</strong> Adaptive Camouflage, Strong-Legged</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con; bite gains Strong Attack (Bite).</p><p>Adaptive Camouflage (Ex):</p><p>If given 8 hours in a new environment, the mule-lizard can changed the colors and patterns in its skin to grant itself a +4 bonus on Stealth checks. Alternatively, the master of the mule lizard can provoke it to take on more flamboyant colors, basically taking on patterns and colors of the master’s choice but they lose the Stealth bonus.</p><p>Strong-legged (Ex):</p><p>The mule-lizard is bipedal but has stable, strong legs. They gain a +4 bonus on their CMD vs. Bull Rush and Trip. Additionally, they may carry loads as if they were a quadruped and may carry riders up to their size.</p>
