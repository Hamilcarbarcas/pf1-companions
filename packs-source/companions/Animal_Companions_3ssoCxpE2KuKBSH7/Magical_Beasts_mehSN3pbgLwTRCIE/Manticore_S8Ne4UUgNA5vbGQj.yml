  description:
    value: '<p><strong>Natural Attacks:</strong> bite (1d6), 2 claws (1d6)</p><p><strong>Special Qualities:</strong> Racial Skill Bonus: +4 Perception, +4 Survival When Tracking</p><p><strong>Special Attacks:</strong> Spikes</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Spikes (upgraded).</p><p>Spikes (Ex):</p><p>With a snap of its tail, a manticore can loose a volley of four spikes as a Standard Action (make an attack roll for each spike). This attack has a range of 180 feet with no range increment, and each spike deals 1d4 + the manticore''s Strength modifier damage. All targets must be within 30 feet of each other. The creature can launch only 12 spikes in any 24-hour period. At 7th level, the damage increases to 1d6 damage, and it can launch up to 24 spikes every 24 hours.</p>'
