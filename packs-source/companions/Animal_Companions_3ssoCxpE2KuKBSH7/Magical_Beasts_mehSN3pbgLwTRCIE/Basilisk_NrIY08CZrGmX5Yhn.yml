    value: <p><strong>Natural Attacks:</strong> bite (1d4)</p><p><strong>Special Attacks:</strong> Gaze Attack</p><p><strong>9th-Level Advancement:</strong> +2 natural armor; +4 Dex, +4 Con.</p><p>Gaze Attack (Ex):</p><p>Once per day, the basilisk can use its gaze on one target within 30 ft., causing Paralysis for 1d4 rounds on a failed Fortitude Save (DC 10 + 1/2 HD + Constitution modifier). If the companion's owner possesses the Beast Speaker Mastery feat, this ability functions as the Flesh to Stone spell instead (caster level equals the basilisk's HD) instead.</p>
