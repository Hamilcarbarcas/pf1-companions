  description:
    value: <p>This massive, squat crocodilian has forward facing eyes, jutting teeth, and a pronounced snout.</p><p><strong>Natural Attacks:</strong> bite (1d6), tail slap (1d6)</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +6 Str, -2 Dex, +4 Con; Ramming Snout.</p><p>Ramming Snout (Ex):</p><p>When a kaprosuchus charges, it can ram an opponent with the calcified tip of its snout. This attack has the same attack bonus as the kaprosuchus’s bite attack, and it deals an amount of bludgeoning damage equal to the kaprosuchus’s bite damage. If the attack is successful, the kaprosuchus can attempt a Trip combat maneuver against the target as a Free Action.</p>
