  description:
    value: <p>This quadrupedal dinosaur has two rows of dorsal spikes, a spiked tail, and two more spikes projecting from its shoulders.</p><p><strong>Natural Attacks:</strong> tail (1d8)</p><p><strong>Special Qualities:</strong> impaling strike</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Defensive Spikes.</p><p>Defensive Spikes (Ex):</p><p>At the end of its turn, a kentrosaurus can crouch down and splay its back and shoulder spikes. It cannot make attacks of opportunity when using its defensive spikes in this way, but until its next turn any creature that attacks the kentrosaurus with light or one-handed melee weapons, natural weapons, or unarmed strikes takes 1d6 points of piercing damage unless it succeeds at a Reflex saving throw (DC = 10 + 1/2 HD + Dexterity modifier).</p>
