  description:
    value: <p>This creature resembles an elephant, though it has a shorter, thicker trunk and sharp, downward-curving tusks.</p><p><strong>Natural Attacks:</strong> slam (1d6), gore (1d8)</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Sweep, Trample.</p><p>Sweep (Ex):</p><p>A deinotherium can sweep a target with its downward-curving tusks and knock the victim to the ground. As part of a Charge, a deinotherium can move up to twice its base speed in a straight line and make a gore attack at any point during its movement. If this attack is successful, the target is knocked Prone and the deinotherium can deal damage with its Trample attack before continuing its movement.</p>
