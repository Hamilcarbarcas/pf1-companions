    value: <p>This bulky, four-legged dinosaur has a long nasal horn and a crest studded with additional horns sweeping back from its skull.</p><p><strong>Natural Attacks:</strong> gore (1d8)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Ferocity, Reflexive Strike.</p><p>Reflexive Strike (Ex):</p><p>A styracosaurus can make three additional attacks of opportunity each round. The dinosaur makes these attacks with its horned crest, but they are treated as normal gore attacks. This ability stacks with the Combat Reflexes feat.</p>
