  description:
    value: <p>This enormous, long-necked quadruped moves with an uncanny grace, holding its lengthy, whiplike tail out level behind it.</p><p><strong>Natural Attacks:</strong> tail (1d8)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +6 Str, +4 Con; Tail Lash.</p><p>Tail Lash (Ex):</p><p>The diplodocus prefers to attack with its tail. The dinosaur can snap its incredibly long tail with surprising speed like an enormous whip—this is a primary attack that deals bludgeoning and slashing damage. A diplodocus can make two separate attacks with its tail lash as a full-attack action.</p>
