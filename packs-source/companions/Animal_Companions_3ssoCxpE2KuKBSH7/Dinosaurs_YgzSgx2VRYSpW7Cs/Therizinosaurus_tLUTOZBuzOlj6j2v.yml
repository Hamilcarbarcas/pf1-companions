  description:
    value: <p>This feathered bipedal saurian looks somewhat comical—save for its outlandish sword-sized claws.</p><p><strong>Natural Attacks:</strong> 2 claws (1d6)</p><p><strong>Special Qualities:</strong> sprint</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Bleed (1d6), Sweeping Strike.</p><p>Sprint (Ex):</p><p>Once per hour, a small cat can move at 10 times its normal speed (500 feet) when it makes a Charge.</p><p>Sweeping Strike (Ex):</p><p>As a Full-Round Action, a therizinosaurus can hunker down and make a great, sweeping attack with its claws against up to four adjacent foes. The dinosaur makes an attack roll against each target, inflicting claw damage on a successful hit.</p>
