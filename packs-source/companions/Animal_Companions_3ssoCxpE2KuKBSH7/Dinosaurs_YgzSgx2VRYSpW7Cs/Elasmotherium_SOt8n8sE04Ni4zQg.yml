  description:
    value: <p>This lumbering, four-legged, rhino-like beast has thick hide and a single immense horn protruding from the top of its head.</p><p><strong>Natural Attacks:</strong> gore (1d8)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Impaling Horn, Powerful Charge (gore).</p><p>Impaling Horn (Ex):</p><p>An elasmotherium’s immense horn can fully impale a creature that is two or more size categories smaller than it. This ability effectively adds the Grab ability to the elasmotherium’s gore attack against such a creature, but if the elasmotherium successfully “grabs” a foe in this manner by impaling it on the horn, the elasmotherium does not gain the Grappled condition. An elasmotherium’s options while grappling a foe in this way are limited—it can either move while grappling the foe, or it can whip its head and attempt to fling the foe as if using the Awesome Blow feat (the damage dealt by this is equal to its gore damage). An elasmotherium can impale only one creature at a time with its horn, but can continue to attack normally with its gore.</p>
