    value: <p>This small, slender-necked dinosaur’s bright, inquisitive eyes seem to miss nothing.</p><p><strong>Natural Attacks:</strong> bite (1d4), 2 claws (1d3)</p><p><strong>Special Qualities:</strong> Easily Trained</p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, +4 Dex, +4 Con.</p><p>Easily Trained (Ex):</p><p>A troodon is unusually quick to pick up tricks and animal training. All Handle Animal checks made to train a troodon gain a +2 bonus. A troodon can learn an additional 2 tricks beyond what an animal of its Intelligence can normally be taught.</p>
