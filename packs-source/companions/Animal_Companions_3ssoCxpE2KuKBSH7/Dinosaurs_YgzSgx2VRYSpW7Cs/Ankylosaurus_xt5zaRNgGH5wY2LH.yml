  description:
    value: <p>Thick bony plates armor the domelike back of this quadrupedal dinosaur, its powerfully muscled tail ending in a bony club.</p><p><strong>Natural Attacks:</strong> tail (1d6)</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; tail gains Strong Attack (Tail Slap); Stun.</p><p>Stun (Ex):</p><p>The ankylosaurus’s tail can deliver a powerful, stunning blow. A creature struck by this attack must make a DC (10 + 1/2 HD + Str modifier) Fortitude Save or be Dazed for 1 round. If the strike is a critical hit and the target fails its save, it is instead Stunned for 1d4 rounds.</p>
