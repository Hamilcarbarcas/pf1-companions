  description:
    value: <p>Bladelike horns jut from the snout and eye ridges of this toothy, bipedal dinosaur.</p><p><strong>Natural Attacks:</strong> bite (1d8)</p><p><strong>Special Qualities:</strong> Trip</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Blood Rage, Ferocity.</p><p>Blood Rage (Ex):</p><p>When a ceratosaurus takes damage in combat, on its next turn it can fly into a rage as a Free Action. It gains +2 Constitution and +2 Strength, but takes a -2 penalty to its AC. The rage lasts as long as the battle or 1 minute, whichever is shorter. It cannot end its rage voluntarily.</p>
