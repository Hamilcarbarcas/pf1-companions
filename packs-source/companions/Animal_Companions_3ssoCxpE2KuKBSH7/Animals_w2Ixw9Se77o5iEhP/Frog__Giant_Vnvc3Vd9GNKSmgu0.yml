  description:
    value: <p>This creature looks like a normal frog, with moist, mottled, blackish-green skin, but grown to truly monstrous size.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>Special Attacks:</strong> Tongue, Pull (Tongue, 5 ft.)</p><p><strong>4th-Level Advancement:</strong> +2 Str, +2 Dex; Swallow Whole.</p><p>Tongue (Ex):</p><p>A giant frog’s tongue is a primary attack with reach equal to three times the frog’s normal reach (15 feet for a Medium giant frog). A giant frog’s tongue deals no damage on a hit, but can be used to Grab. A giant frog does not gain the Grappled condition while using its tongue in this manner.</p>
