  description:
    value: <p>An oversized lizard the size of a horse scans the area, its bulging eyes darting this way and that, completely independent of one another. Every few moments a long pink tongue snaps from its wide mouth, either to snatch up some unseen insect or moisten an eye.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>Special Qualities:</strong> Expert Climber</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, -2 Dex, +2 Con.</p><p>Expert Climber (Ex):</p><p>A gecko’s feet allow it to climb virtually any surface, no matter how slick or sheer. In effect, geckos are treated as constantly being under a natural version of the spell Spider Climb.</p>
