  description:
    value: <p>This muscular, cougarlike cat has fearsome teeth and a thick tail ending in a spiked ball.</p><p><strong>Natural Attacks:</strong> bite (1d4), 2 claws (1d2), tail (1d2)</p><p><strong>Special Qualities:</strong> Ball Tail</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con.</p><p>Ball Tail (Ex):</p><p>A digmaul has a spiked ball at the end of its tail, which it can use as a secondary Natural Attack that deals 1d4 points of bludgeoning and piercing damage. The digmaul can substitute a Trip or Bull Rush Combat Maneuver Check for its normal tail attack. Such a combat maneuver check doesn’t provoke Attacks of Opportunity and receives a +4 Racial bonus; a digmaul that fails its Trip attempt by 10 or more in this way is not tripped.</p>
