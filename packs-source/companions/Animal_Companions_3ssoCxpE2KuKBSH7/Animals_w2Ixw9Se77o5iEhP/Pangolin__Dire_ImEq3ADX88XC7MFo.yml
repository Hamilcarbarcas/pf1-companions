    value: <p><strong>Natural Attacks:</strong> 2 claws (1d4)</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con; Razor Scales.</p><p>Razor Scales (Ex):</p><p>A dire pangolin’s scales come to fine slicing edges. A creature that strikes a dire pangolin while it is taking a Total Defense action with a melee weapon, an unarmed strike, or a Natural Weapon takes 1d8 + Strength modifier points of slashing damage. Melee weapons with reach do not endanger a user in this way.</p>
