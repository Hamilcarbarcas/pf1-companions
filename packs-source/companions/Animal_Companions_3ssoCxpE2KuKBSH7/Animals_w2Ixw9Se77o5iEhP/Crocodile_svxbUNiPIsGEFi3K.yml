  description:
    value: '<p>This reptile lunges out of the placid water with shocking speed. Its jaw gapes open in a roar, its powerful tail lashing behind.</p><p><strong>Natural Attacks:</strong> bite (1d6 plus grab)</p><p><strong>Special Qualities:</strong> Hold Breath</p><p><strong>Special Attacks:</strong> Grab</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con; new attacks: tail slap (2d6); Sprint, Death Roll.</p><p>Death Roll (Ex):</p><p>When grappling a foe of its size or smaller, a crocodile can perform a death roll upon making a successful Grapple check. As it clings to its foe, it tucks in its legs and rolls rapidly, twisting and wrenching its victim. The crocodile inflicts its bite damage and knocks the creature Prone. If successful, the crocodile maintains its Grapple.</p><p>Sprint (Ex):</p><p>Once per minute a crocodile may sprint, increasing its land speed to 40 feet for 1 round.</p>'
