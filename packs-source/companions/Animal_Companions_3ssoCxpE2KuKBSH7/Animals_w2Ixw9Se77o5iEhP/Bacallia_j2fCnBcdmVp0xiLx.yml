  description:
    value: <p>This animal resembles an alpaca with voluminous, shiny wool.</p><p><strong>Natural Attacks:</strong> 2 hoofs (1d4)</p><p><strong>Special Qualities:</strong> Pristine Wool</p><p><strong>Special Attacks:</strong> Spit</p><p><strong>4th-Level Advancement:</strong> +2 Str, +2 Con.</p><p>Spit (Ex):</p><p>Once per hour, a bacallia can spit its foul stomach contents at a single target within 10 feet. The target must succeed at a Fortitude Save (DC = 10 + 1/2 HD + Constitution modifier) or be Sickened for 1d4 rounds.</p><p>Pristine Wool (Ex):</p><p>Most impurities bead and slide off a bacallia’s dense wool, leaving it gleamingly clean. This grants the bacallia a +2 Racial bonus on Saving Throws against contact poisons and effects that would entangle it. It also gains a +1 bonus to its touch AC.</p><p>Dazzling (Ex):</p><p>While uninjured and in normal or bright light, a bacallia’s wool reflects light in distracting ways. All non-bacallias within 10 feet take a -1 penalty on Saving Throws against effects that would dazzle or fascinate them.</p>
