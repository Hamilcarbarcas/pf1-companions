  description:
    value: <p>This large bird has brown and gray feathers and a vicious hooked beak.</p><p><strong>Natural Attacks:</strong> bite (1d4)</p><p><strong>7th-Level Advancement:</strong> size Medium; +2 natural armor; +2 Str, +2 Con; Impale.</p><p>Impale (Ex):</p><p>When an impaler shrike has a creature at least one size smaller than itself Grappled in its beak, it can move the creature to a dangerous location, such as a spike or a Broken tree limb. This works like the Reposition combat maneuver, except the shrike can move an opponent to an occupied square. An impaler shrike still provokes an Attack of Opportunity using this ability, so it typically pins its victim before attempting this maneuver. As part of this Reposition, an impaler shrike can attempt a melee Touch Attack against an AC of 15 to impale the victim on a nearby spike or similar Object. If this attack is successful, the victim takes an amount of piercing damage appropriate for the impaling Object’s size.</p>
