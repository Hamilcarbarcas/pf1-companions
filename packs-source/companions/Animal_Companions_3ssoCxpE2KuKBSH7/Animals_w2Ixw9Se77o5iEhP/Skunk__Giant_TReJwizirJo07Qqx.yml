  description:
    value: <p>Its unmistakable black-and-white-striped coloration gives a clear warning sign to any who’ve experienced this foul-smelling creature’s ire.</p><p><strong>Natural Attacks:</strong> bite (1d6), 2 claws (1d4)</p><p><strong>Special Qualities:</strong> Musk</p><p><strong>Special Attacks:</strong> Spray (1/day)</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Musk (upgraded), Spray (2/day).</p><p>Musk (Ex):</p><p>(Fort save or Sickened for 1d6 rounds, Con-based DC) After Advancement - (Fort save or Nauseated for 1d3 rounds);</p><p>Spray (Ex):</p><p>A giant skunk can make a ranged Touch Attack to apply their musk to a target within 30 feet. This ability can be used once per day. At 7th level, this ability can be used twice per day.</p>
