  description:
    value: '<p>Dense, bony growths line the back of this bipedal predator. Between its gnashing, toothy underbite, scythe-like claws, and spiked tail, no part of this beast offers mercy.</p><p><strong>Natural Attacks:</strong> bite (1d6), tail barb (1d4 plus poison)</p><p><strong>Special Attacks:</strong> Poison</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +6 Str, -2 Dex, +2 Con; new attacks: 2 claws (1d4); Pounce.</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, moderate Dexterity, 1 save to cure.</p><p>*This is a secondary natural attack that deals piercing damage, and takes a -5 penalty to hit, see Natural Weapon for more information on how secondary attacks work.</p>'
