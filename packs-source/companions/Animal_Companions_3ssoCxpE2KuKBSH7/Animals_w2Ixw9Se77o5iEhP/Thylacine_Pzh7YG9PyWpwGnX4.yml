  description:
    value: <p>This odd creature is about the size of a dog, but it has the slender build of a cat, heavy whiskers, and dark stripes down its back. Its long tail flips about, smacking the ground as it scans the woods. It yips and bays in a complex pattern, offering warning to anything that may cross its path.</p><p><strong>Natural Attacks:</strong> bite (1d4)</p><p><strong>Special Qualities:</strong> Powerful Jaws</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, -2 Dex, +4 Con.</p><p>Powerful Jaws (Ex):</p><p>A thylacine’s muscular jaws threaten a critical hit on a natural roll of 19 or 20.</p>
