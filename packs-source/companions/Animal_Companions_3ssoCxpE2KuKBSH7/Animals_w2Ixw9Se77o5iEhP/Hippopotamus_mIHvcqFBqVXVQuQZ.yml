  description:
    value: <p>This fleshy behemoth wallows forward on four stumpy legs. Its jaws spread wide in a roar of challenge, exposing massive, tusk-like teeth.</p><p><strong>Natural Attacks:</strong> bite (2d6)</p><p><strong>Special Qualities:</strong> Sweat</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Trample.</p><p>Sweat (Ex):</p><p>A hippo’s reddish sweat protects it from nonlethal damage from hot environments, and grants it a +2 Racial bonus on Saving Throws against nonmagical Disease.</p>
