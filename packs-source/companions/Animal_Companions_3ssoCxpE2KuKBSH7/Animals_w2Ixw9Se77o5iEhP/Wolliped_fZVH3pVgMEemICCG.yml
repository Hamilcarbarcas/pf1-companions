  description:
    value: <p>This shaggy, multi-legged creature has a flattened face with wide nostrils and four eyes. Ivory tusks jut downward, flanking its mouth.</p><p><strong>Natural Attacks:</strong> gore (1d6)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +4 Str, -2 Dex, +4 Con; Spit, Trample.</p><p>Spit (Ex):</p><p>Once per hour, a wolliped can regurgitate the contents of its stomach, spitting the foul slurry at a single target within 10 feet as a ranged Touch Attack. On a successful hit, the target must succeed at a Fortitude Save (DC = 10 + 1/2 HD + Constitution modifier) or be Sickened for 1d4 rounds.</p>
