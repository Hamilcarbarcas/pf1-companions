  description:
    value: <p>Hobgoblin druids, hunters, and rangers who can take an animal companion can choose a hobbe hound.</p><p><strong>Natural Attacks:</strong> bite (1d6 plus allergic reaction)</p><p><strong>Special Qualities:</strong> Allergic Reaction</p><p><strong>7th-Level Advancement:</strong> +3 natural armor; +6 Str, -2 Dex, +2 Con; Fire Resistance 3.</p><p>Allergic Reaction (Ex):</p><p>A hobbe hound’s saliva and skin produce highly irritating secretions that affect all creatures except those with the Goblinoid Subtype. A non-goblinoid creature that takes damage from a hobbe hound’s bite, deals damage to a hobbe hound with a Natural Weapon or Unarmed Attack, or otherwise comes into contact with a hobbe hound (including attempts to Grapple or Ride the creature) must succeed at a Fortitude Save (DC = 10 + 1/2 HD + Constitution modifier) or break out in an itchy rash.</p><p>A creature affected by this rash takes a -2 penalty to Dexterity and Charisma for 24 hours (multiple allergic reactions do not stack). Remove Disease or any form of magical healing removes the rash instantly. This is a Disease effect.</p>
