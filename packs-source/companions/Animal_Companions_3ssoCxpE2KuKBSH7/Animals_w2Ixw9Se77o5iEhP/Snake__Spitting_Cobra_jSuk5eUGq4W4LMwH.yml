  description:
    value: <p>This brightly colored snake can spit its venom, giving it a dangerous ranged attack.</p><p><strong>Natural Attacks:</strong> bite (1d3 plus poison)</p><p><strong>Special Attacks:</strong> Poison, Spit</p><p><strong>7th-Level Advancement:</strong> +2 Dex, +2 Con; Poison (upgraded).</p><p>Poison (Ex):</p><p>Contact, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 6 rounds, causes blurred vision (20% miss chance for 1 round), 1 save to cure. At 7th level, the poison advances to cause the target to become Blinded for 1 round instead of blurred vision.</p><p>Spit (Ex):</p><p>A spitting cobra can make a ranged Touch Attack to apply their poison on a target within 10 feet. This ability can be used once every 2d4 rounds.</p>
