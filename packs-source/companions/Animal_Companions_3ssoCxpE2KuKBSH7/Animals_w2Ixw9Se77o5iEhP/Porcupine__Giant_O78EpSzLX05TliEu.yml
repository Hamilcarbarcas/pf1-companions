  description:
    value: <p>This lumbering forest creature is adorned with an array of long, sharp quills that protrude from its coarse pelt.</p><p><strong>Natural Attacks:</strong> tail slap (1d4)</p><p><strong>Special Attacks:</strong> Quills</p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +2 Str, -2 Dex, +4 Con; Quills (upgraded).</p><p>Quills (Ex):</p><p>Any creature attacking a porcupine with a Natural Weapon or an Unarmed Attack takes 1 point of piercing damage. A creature that Grapples a porcupine takes 1d3 points of piercing damage each round it does so. At 4th level, the damage from attacking the porcupine increases to 1d3 and also includes attacks with a light or one-handed weapon, and the damage a creature takes for grappling it increases to 2d4.</p>
