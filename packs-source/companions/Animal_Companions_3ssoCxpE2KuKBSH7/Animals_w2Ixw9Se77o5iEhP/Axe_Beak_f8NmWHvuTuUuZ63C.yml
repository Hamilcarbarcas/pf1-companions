  description:
    value: <p>This stout bird stands upon two long, muscular legs, each ending in a large, curved talon. A pair of undersized wings sprouts from amid its broad body feathers, as does a powerful neck ending in an avian head armed with a grisly serrated beak.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>4th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con; Sudden Charge.</p><p>Sudden Charge (Ex):</p><p>When making a Charge attack, an axe beak makes a single bite attack. If successful, it may also attempt to Trip its opponent as a Free Action without provoking an Attack of Opportunity. If the attempt fails, the axe beak cannot be tripped in return.</p>
