  description:
    value: <p>This mangy dog's face has the flat nose, beady eyes, and protruding teeth of a rat grown grotesquely large.</p><p><strong>Natural Attacks:</strong> bite (1d4)</p><p><strong>Special Qualities:</strong> Allergic Reaction</p><p><strong>4th-Level Advancement:</strong> size Medium; +1 natural armor; +4 Str, -2 Dex, +4 Con.</p><p>Allergic Reaction (Ex):</p><p>A goblin dog’s dander is highly irritating to all creatures save those with the Goblinoid Subtype. A non-goblinoid creature damaged by a goblin dog’s bite, who deals damage to a goblin dog with a Natural Weapon or Unarmed Attack, or who otherwise comes into contact with a goblin dog (including attempts to Grapple or Ride the creature) must make a Fortitude Save (DC 10 + 1/2 HD + Constitution modifier) or break out in an itching rash. A creature affected by this rash takes a -2 penalty to Dexterity and Charisma for 1 day (multiple allergic reactions do not stack). Remove Disease or any magical healing removes the rash instantly. This is a Disease effect.</p>
