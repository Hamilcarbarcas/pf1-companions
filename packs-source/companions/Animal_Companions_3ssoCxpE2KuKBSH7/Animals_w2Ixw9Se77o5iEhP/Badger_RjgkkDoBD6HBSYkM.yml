  description:
    value: <p>This stocky, muscular mammal is the size of a badger, its snarling lips revealing a mouth full of yellow teeth.</p><p><strong>Natural Attacks:</strong> bite (1d4), 2 claws (1d3)</p><p><strong>Special Qualities:</strong> rage</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con.</p><p>Rage (Ex):</p><p>As a Free Action a badger can enter a rage, gaining a +2 bonus on Melee Attack rolls, melee damage rolls, thrown weapon damage rolls, and Will Saving Throws . In addition, they take a -2 penalty to Armor Class . They also gain 2 temporary hit points per Hit Die. A badger can rage for up to 4 rounds per day. When their rage ends, they are Fatigued for 1 minute.</p>
