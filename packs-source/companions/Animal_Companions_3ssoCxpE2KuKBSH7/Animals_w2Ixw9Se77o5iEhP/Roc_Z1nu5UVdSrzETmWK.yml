  description:
    value: <p>Rocs taken as animal companions by druids or rangers are typically newly hatched birds—a baby roc is the size of a person and ready for flight and hunting within minutes of hatching. Unfortunately for druids seeking animal companions of legendary size, an animal companion roc is limited to Large size—still large enough for a Medium druid or ranger to use the flying beast as a mount.</p><p><strong>Natural Attacks:</strong> 2 talons (1d4), bite (1d6)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Grab.</p>
