    value: <p>This large, horned bull has a dirty black hide and an aggressive temper. Its horns are wide and sharp.</p><p><strong>Natural Attacks:</strong> gore (1d6)</p><p><strong>7th-Level Advancement:</strong> size Large; +3 natural armor; +8 Str, -2 Dex, +4 Con; Stampede, Trample.</p><p>Stampede (Ex):</p><p>A stampede occurs if three or more creatures with stampede make a Trample attack while remaining adjacent to each other. While stampeding, the creatures can Trample foes of their size or smaller, and the Trample’s save DC increases by +2.</p>
