  description:
    value: <p>This large, tawny rodent has powerful forelimbs ending in spade-like claws. Sand and mud cakes the creature’s fur.</p><p><strong>Natural Attacks:</strong> bite (1d4), 2 claws (1d4)</p><p><strong>4th-Level Advancement:</strong> size Medium; +2 natural armor; +4 Str, +2 Dex, +2 Con; Dust Cloud.</p><p>Dust Cloud (Ex):</p><p>Three times per day as a Move Action, a sorico can shake loose a cloud of dust and sand from its coat that fills its space, providing Concealment for 1 round. A light wind disperses this cloud immediately. Any creatures sharing a sorico’s space when it uses this ability must succeed at a Fortitude Save (DC = 10 + 1/2 HD + Constitution modifier) or become Staggered for 1 round as they cough and sneeze. Creatures that don’t breathe are immune to this effect.</p>
