  description:
    value: '<p>Sharp quills cover this bright yellow, six-legged animal, and its long, twitching snout probes the air around it.</p><p><strong>Natural Attacks:</strong> gore (1d6)</p><p><strong>Special Attacks:</strong> Roll Up</p><p><strong>4th-Level Advancement:</strong> +2 natural armor; +2 Str, +2 Con; new attacks: tail slap (1d4); Poison, Quills.</p><p>Roll Up (Ex):</p><p>As a Move Action, a pilo can tuck itself into a ball. This grants the pilo a +4 bonus to its natural armor, but its speed is reduced to 10 feet.</p><p>Poison (Ex):</p><p>Injury, DC = 10 + 1/2 HD + Constitution modifier, 1/round for 4 rounds, moderate Dexterity, 1 save to cure.</p><p>Quills (Ex):</p><p>Any creature attacking a pilo with a Natural Weapon or an Unarmed Attack takes 1d6 points of piercing damage. A creature that grapples a pilo takes 2d6 points of piercing damage each round it is engaged in a Grapple. A pilo can also use its quills to damage any opponent it successfully bull rushes. Any creature that takes damage from a pilo’s quills risks being poisoned.</p>'
