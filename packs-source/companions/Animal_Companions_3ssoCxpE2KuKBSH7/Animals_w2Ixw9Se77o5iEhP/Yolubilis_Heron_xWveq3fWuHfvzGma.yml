  description:
    value: <p>As tall as a tree, this dark gray bird stands on long legs. Its curved neck supports a sleek head with a slim but wicked beak.</p><p><strong>Natural Attacks:</strong> bite (1d8)</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +2 Con; Still Predator.</p><p>Still Predator (Ex):</p><p>A Yolubilis heron has the ability to stand perfectly still for hours at a time while awaiting prey, making it easy to mistake the bird’s legs for slim tree trunks. A Yolubilis heron can use the Freeze ability while adjacent to trees or any vegetation that could conceal its upper body. While standing in water, it can use the Freeze ability against submerged creatures. Other creatures with low Intelligence scores or poor senses might be tricked by this ability as well.</p>
