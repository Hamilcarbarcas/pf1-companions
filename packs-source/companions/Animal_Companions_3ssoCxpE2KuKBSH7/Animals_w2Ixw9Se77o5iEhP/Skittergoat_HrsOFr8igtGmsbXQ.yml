  description:
    value: <p>This small goat has sharp horns that wrap around its head to point forward, making it resemble a tiny bull.</p><p><strong>Natural Attacks:</strong> gore (1d4)</p><p><strong>4th-Level Advancement:</strong> size Medium; +4 Str, -2 Dex, +2 Con; Egg Cracker.</p><p>Egg Cracker (Ex):</p><p>A skittergoat’s horns are able to crack through the tough shells of ankheg eggs. When a skittergoat charges, its gore attack is resolved against the target’s touch AC. In addition, when breaking an Object, a skittergoat ignores 1 point of the Object’s Hardness.</p>
