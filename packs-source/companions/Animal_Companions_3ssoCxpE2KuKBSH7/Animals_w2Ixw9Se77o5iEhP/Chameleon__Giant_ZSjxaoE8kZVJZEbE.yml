  description:
    value: <p>Nearly invisible in its surroundings, this scaly lizard’s eyes dart about independently of each other.</p><p><strong>Natural Attacks:</strong> bite (1d6)</p><p><strong>Special Qualities:</strong> +10 Stealth when still</p><p><strong>4th-Level Advancement:</strong> size Large; +2 natural armor; +4 Str, -2 Dex, +2 Con; Tongue, Pull (tongue, 5 ft.).</p><p>Tongue (Ex):</p><p>A giant chameleon can Grab a foe with its tongue and draw the victim to its mouth. This tongue attack has a reach of 15 feet. The attack does no damage, but allows the creature to Grab. A giant chameleon does not gain the Grappled condition while using its tongue in this manner.</p>
