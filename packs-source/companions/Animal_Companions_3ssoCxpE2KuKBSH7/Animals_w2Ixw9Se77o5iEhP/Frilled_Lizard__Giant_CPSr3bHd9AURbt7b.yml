  description:
    value: <p>This large lizard can display a frightening frill on its neck when it charges.</p><p><strong>Natural Attacks:</strong> bite (1d6), tail (1d4)</p><p><strong>Special Attacks:</strong> Intimidating Charge</p><p><strong>7th-Level Advancement:</strong> size Large; +2 natural armor; +8 Str, -2 Dex, +4 Con.</p><p>Intimidating Charge (Ex):</p><p>When a giant frilled lizard charges, it hisses ferociously, extends its neck frills, and darts forward on its hind legs, increasing its base speed to 50 feet for that round. In addition to the normal effects of a Charge, the creature charged must make a Will Save (DC = 10 + 1/2 HD + Charisma modifier) or be Shaken for 1d6 rounds. This is a Fear effect.</p>
