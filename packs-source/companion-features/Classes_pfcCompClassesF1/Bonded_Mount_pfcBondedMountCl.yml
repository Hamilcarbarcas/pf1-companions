  description:
    value: <p>A paladin's bonded mount functions as an animal companion, using the paladin's level as its effective level. It has an Intelligence of at least 6, gains the celestial creature simple template at 11th level (a magical beast for the purposes of which spells affect it), and spell resistance equal to the paladin's level + 11 at 15th.</p><p><strong>Level</strong> is the paladin's level; PF1 Companions keeps it in step. Everything else follows the animal companion table.</p><h3>Skills</h3><p>Animal companions can have ranks in Acrobatics* (Dex), Climb* (Str), Escape Artist (Dex), Fly* (Dex), Intimidate (Cha), Perception* (Wis), Stealth* (Dex), Survival (Wis), and Swim* (Str). Skills marked * are class skills. An animal companion cannot have more ranks in a skill than it has Hit Dice; with Intelligence 3 or higher it can put ranks into any skill.</p><h3>Feats</h3><p>Animal companions select feats from the animal feat list; with Intelligence 3 or higher they can select any feat they are physically capable of using. They cannot select a feat requiring base attack bonus +1 until their second feat at 3 Hit Dice.</p>
