  description:
    value: <p>An animal companion's abilities are determined by the master's level and its animal racial traits. They remain creatures of the animal type for purposes of determining which spells can affect them.</p><p><strong>Level</strong> is the master's effective level; PF1 Companions keeps it in step with the master. Hit Dice, base attack bonus, saves, skill ranks and feats follow the animal companion table from it.</p><h3>Skills</h3><p>Animal companions can have ranks in Acrobatics* (Dex), Climb* (Str), Escape Artist (Dex), Fly* (Dex), Intimidate (Cha), Perception* (Wis), Stealth* (Dex), Survival (Wis), and Swim* (Str). Skills marked * are class skills. An animal companion cannot have more ranks in a skill than it has Hit Dice; with Intelligence 3 or higher it can put ranks into any skill.</p><h3>Feats</h3><p>Animal companions select feats from the animal feat list; with Intelligence 3 or higher they can select any feat they are physically capable of using. They cannot select a feat requiring base attack bonus +1 until their second feat at 3 Hit Dice.</p>
