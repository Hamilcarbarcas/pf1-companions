  description:
    value: <p>A familiar is an animal chosen by a spellcaster to aid them in their study of magic. It is treated as a magical beast for effects that depend on its type. Its special abilities apply only while the master and familiar are within 1 mile of each other. Levels of different classes entitled to familiars stack.</p><p><strong>Level</strong> is the master's level; PF1 Companions keeps it in step, and the familiar counts as having that many Hit Dice. Base attack bonus, saves, skills and hit points come from the master (see Familiar Basics).</p>
