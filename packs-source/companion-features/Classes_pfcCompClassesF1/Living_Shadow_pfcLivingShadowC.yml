  description:
    value: '<p>A shadowdancer''s shadow, turned into an undead shade (shadowdancer 2nd level). Its alignment matches the shadowdancer''s, it cannot create spawn, and it cannot be turned or commanded. It only functions within 100 ft. of the shadowdancer; beyond that it vanishes and reappears as their shadow one round later.</p><p><strong>Level</strong> is the shadowdancer''s class level; PF1 Companions keeps it in step. <strong>From the master:</strong> hit points half the master''s total, rounded down; the master''s base attack bonus; base saves Fortitude as the master''s, Reflex the master''s +2, Will the master''s +1. Species: Shadow (Living Shadow). At 8th level it becomes a greater shadow (Greater Shadow).</p><p><strong>If destroyed:</strong> the shadowdancer immediately suffers 1 level drain and casts no shadow. The shadow returns in 1 week or when the shadowdancer gains a level, whichever comes first; until then the drain and the missing shadow can''t be removed by any means. (Not automated.)</p>'
