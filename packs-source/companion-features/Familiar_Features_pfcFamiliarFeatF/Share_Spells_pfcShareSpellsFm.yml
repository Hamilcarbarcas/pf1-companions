  description:
    value: <p>At the master's option, any spell (but not any spell-like ability) the master casts on themself also affects the familiar. The familiar must be within 5 feet at the time of casting to receive the benefit. If the spell or effect has a duration other than instantaneous, it stops affecting the familiar if it moves farther than 5 feet away and will not affect the familiar again even if it returns before the duration expires. Additionally, the master may cast a spell with a target of "You" on the familiar (as a touch range spell) instead of on themself. A master and their familiar can share spells even if the spells normally do not affect creatures of the familiar's type (magical beast).</p>
  subType: companion
