  description:
    value: <p>A familiar uses the basic statistics for a creature of its kind, with these changes. It counts as having Hit Dice equal to the master's level.</p><ul><li><strong>Hit Points:</strong> half the master's total hit points (not including temporary hit points), rounded down.</li><li><strong>Attacks:</strong> the master's base attack bonus; Strength or Dexterity, whichever is greater, for melee attacks with natural weapons.</li><li><strong>Saving Throws:</strong> for each save, the familiar's base save bonus (Fortitude +2, Reflex +2, Will +0) or the master's, whichever is better, with the familiar's own ability modifiers.</li><li><strong>Skills:</strong> for each skill, the familiar's ranks or the master's, whichever is better, with the familiar's own ability modifiers.</li><li><strong>Intelligence:</strong> [[5 + ceil(@class.level / 2)]]. <strong>Natural armor:</strong> +[[ceil(@class.level / 2)]] over its existing bonus.</li></ul>
  flags:
    boolean:
      weaponFinesse: true
