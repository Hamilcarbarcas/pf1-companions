  description:
    value: <p>A familiar can deliver touch spells for the master. If the master and the familiar are in contact at the time the master casts a touch spell, the master can designate the familiar as the "toucher." The familiar can then deliver the touch spell just as the master could. As usual, if the master casts another spell before the touch is delivered, the touch spell dissipates.</p>
