  description:
    value: <p>The master may cast a spell with a target of "You" on their animal companion (as a touch range spell) instead of on themself. The master may cast spells on their animal companion even if the spells normally do not affect creatures of the companion's type (animal). Spells cast in this way must come from a class that grants an animal companion. This ability does not allow the animal to share abilities that are not spells, even if they function like spells.</p>
