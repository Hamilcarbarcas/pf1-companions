  description:
    value: <p>An animal companion gains Multiattack as a bonus feat if it has three or more natural attacks and does not already have that feat. If it does not have the requisite three or more natural attacks, the animal companion instead gains a second attack with its primary natural weapon, albeit at a -5 penalty. A creature with three or more natural attacks and no secondary attacks, or already possessing the Multiattack feat, gains no benefit.</p>
