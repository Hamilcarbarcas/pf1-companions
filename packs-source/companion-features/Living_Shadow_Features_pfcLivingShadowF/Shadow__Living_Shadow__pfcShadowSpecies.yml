  description:
    value: <p><strong>Shadow</strong> (Medium undead, incorporeal), as a shadowdancer's living shadow. Str –, Dex 14, Con –, Int 6, Wis 12, Cha 13. Fly 40 ft. (good). AC 10 + Dex + deflection (Cha). Darkvision 60 ft.</p><p><strong>Skills:</strong> +4 racial on Stealth in dim light, −4 in bright light (a note on Stealth). <strong>Feats:</strong> Alertness, Dodge (from the Living Shadow class).</p><p><strong>Strength damage:</strong> its incorporeal touch deals 1d6 Strength damage to a living foe (negative energy).</p><p><strong>Setup:</strong> Str and Con are none; PF1 Companions blanks them when the shadow is linked. Its other scores start at 10 (the race adds the offsets).</p>
